---
- name: restart jellyfin
  community.docker.docker_compose_v2:
    project_src: /data/services/jellyfin
    files:
      - compose.yml
    state: present
    recreate: always
    remove_orphans: false

- name: restart docker for nvidia
  become: true
  ansible.builtin.systemd:
    name: docker
    state: restarted
