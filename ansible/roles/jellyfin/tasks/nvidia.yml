---
# NVIDIA userspace for GPU transcoding inside the LXC.
# The kernel module lives on the Proxmox node; the container gets the same
# driver's userspace (--no-kernel-module) plus nvidia-container-toolkit so
# Docker can hand the GPU to Jellyfin.

- name: Check the GPU device nodes are passed into the container
  ansible.builtin.stat:
    path: /dev/nvidia0
  register: nvidia_dev

- name: Fail if the GPU is not passed through
  ansible.builtin.fail:
    msg: "/dev/nvidia0 is missing. Set nvidia_gpu = true for this container in terraform.tfvars and apply first."
  when: not nvidia_dev.stat.exists

- name: Read the installed NVIDIA userspace version
  ansible.builtin.command: nvidia-smi --query-gpu=driver_version --format=csv,noheader
  register: nvidia_installed
  changed_when: false
  failed_when: false

- name: Install NVIDIA userspace {{ nvidia_driver_version }}
  when: nvidia_installed.rc != 0 or nvidia_installed.stdout | trim != nvidia_driver_version
  become: true
  block:
    - name: Download the NVIDIA installer
      ansible.builtin.get_url:
        url: "https://download.nvidia.com/XFree86/Linux-x86_64/{{ nvidia_driver_version }}/NVIDIA-Linux-x86_64-{{ nvidia_driver_version }}.run"
        dest: "/root/NVIDIA-Linux-x86_64-{{ nvidia_driver_version }}.run"
        mode: '0755'

    - name: Install NVIDIA userspace without the kernel module
      ansible.builtin.command: >-
        sh /root/NVIDIA-Linux-x86_64-{{ nvidia_driver_version }}.run
        --no-kernel-module --no-x-check --silent

- name: Add the nvidia-container-toolkit signing key
  become: true
  ansible.builtin.shell: >-
    curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey
    | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  args:
    creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg

- name: Add the nvidia-container-toolkit repository
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nvidia-container-toolkit.list
    mode: '0644'
    content: "deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /\n"

- name: Install nvidia-container-toolkit
  become: true
  ansible.builtin.apt:
    name: nvidia-container-toolkit
    state: present
    update_cache: true

# Unprivileged LXC can't manage device cgroups; Proxmox's devN passthrough
# already grants the container access.
- name: Disable cgroup handling in the NVIDIA container runtime
  become: true
  ansible.builtin.lineinfile:
    path: /etc/nvidia-container-runtime/config.toml
    regexp: '^#?\s*no-cgroups\s*='
    line: 'no-cgroups = true'
  notify: restart docker for nvidia

- name: Register the NVIDIA runtime with Docker
  become: true
  ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
  register: nvidia_ctk
  changed_when: "'Wrote updated config' in nvidia_ctk.stdout + nvidia_ctk.stderr"
  notify: restart docker for nvidia

- name: Apply the Docker runtime change before Jellyfin starts
  ansible.builtin.meta: flush_handlers
