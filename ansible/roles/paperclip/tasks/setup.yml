---
# Setup tasks for Paperclip environment file creation
# Run via: ansible-playbook site-setup.yml

- name: Create paperclip config directory locally
  file:
    path: "{{ playbook_dir }}/../homelab_config/ansible/files/config/paperclip"
    state: directory
    mode: '0755'
  delegate_to: 127.0.0.1
  become: false

- name: Check if environment file already exists
  stat:
    path: "{{ playbook_dir }}/../homelab_config/ansible/files/config/paperclip/environment"
  register: paperclip_env_file
  delegate_to: 127.0.0.1
  become: false

- name: Create environment file from template
  template:
    src: "{{ playbook_dir }}/roles/paperclip/templates/environment.j2"
    dest: "{{ playbook_dir }}/../homelab_config/ansible/files/config/paperclip/environment"
    mode: '0640'
  when: not paperclip_env_file.stat.exists
  delegate_to: 127.0.0.1
  become: false

- name: Display setup instructions
  debug:
    msg: |
      Paperclip environment file created at: {{ playbook_dir }}/../homelab_config/ansible/files/config/paperclip/environment

      BETTER_AUTH_SECRET, PAPERCLIP_TOOL_ACTION_SIGNING_SECRET and POSTGRES_PASSWORD
      were generated randomly. Review the file before deploying.

      After deploying with: ansible-playbook site.yml --limit paperclip
        1. Open https://paperclip.<host>.{{ homelab_domain }}, create an account and choose "Claim this instance".
        2. Sign in to Claude and ChatGPT/Codex from the onboarding wizard (or Connections later).
  when: not paperclip_env_file.stat.exists
  delegate_to: 127.0.0.1
  become: false
