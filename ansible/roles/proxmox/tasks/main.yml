# ============================================
# Proxmox Initial Configuration
# ============================================
# Based on: https://technotim.live/posts/first-11-things-proxmox/
# ============================================

- name: Fail on an unsupported Debian release
  ansible.builtin.fail:
    msg: "The proxmox role only knows bookworm (PVE 8) and trixie (PVE 9), not {{ ansible_distribution_release }}"
  when: ansible_distribution_release not in ['bookworm', 'trixie']

# PVE 8 keeps one-line .list sources; PVE 9 uses deb822 .sources files and
# must not get bookworm lines added back to sources.list.
# Runs before any apt cache refresh: a dist-upgrade can reinstall an enabled
# pve-enterprise.sources, and its 401 would fail the refresh.
- name: Configure package sources for {{ ansible_distribution_release }}
  ansible.builtin.include_tasks: "repos-{{ ansible_distribution_release }}.yml"

- name: Install required packages for Proxmox automation
  apt:
    name: "{{ item }}"
    state: present
    update_cache: yes
  loop:
    - python3-proxmoxer

- name: Install admin tools
  ansible.builtin.apt:
    name: "{{ proxmox_admin_packages }}"
    state: present
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - packages

- name: Configure the outbound mail relay
  ansible.builtin.import_tasks: mail-relay.yml
  tags:
    - mail

- name: Load kernel modules guests need
  ansible.builtin.import_tasks: kernel-modules.yml
  tags:
    - kernel-modules

- name: Update LXC template repository
  ansible.builtin.shell:
    cmd: pveam update
  changed_when: false

- name: Download Debian 12 standard LXC template
  ansible.builtin.shell:
    cmd: pveam download local debian-12-standard_12.12-1_amd64.tar.zst
  args:
    creates: /var/lib/vz/template/cache/debian-12-standard_12.12-1_amd64.tar.zst

